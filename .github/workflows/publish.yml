name: Publish to NPM
on:
  push:
    branches:
      - production

permissions: {}

jobs:
  # Builds the package without any publishing rights: dependencies and build
  # scripts never see an OIDC token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'

      - name: Check for new version
        id: version
        run: |
          VERSION=$(jq -r '.version' packages/jspdf-fontkit/package.json)
          if npm view "jspdf-fontkit@$VERSION" version >/dev/null 2>&1; then
            echo "jspdf-fontkit@$VERSION is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: |
          echo "Applying patch..."
          patch -p1 < submodules.patch

          echo "Installing pnpm..."
          npm install -g pnpm@12.15.0

          echo "Installing dependencies..."
          pnpm install --frozen-lockfile

          echo "Building..."
          pnpm run build

          echo "Packing..."
          cd packages/jspdf-fontkit
          pnpm pack --out package.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.publish == 'true'
        with:
          name: package
          path: packages/jspdf-fontkit/package.tgz
          if-no-files-found: error

  # Only publishes the tarball built above; nothing else runs with the token.
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing (OIDC)

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; use the npm bundled with Node
      # instead of installing one in a job that holds the token.
      - name: Check npm version
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)"

      - name: Publish
        run: npm publish package.tgz --access public
