name: Publish to NPM
on:
  push:
    branches:
      - production

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Check for new version
        uses: salsify/action-detect-and-tag-new-version@v2
        id: detect-new-version
        with:
          create-tag: false
          version-command: |
            jq -r '.version' packages/jspdf-fontkit/package.json

      - name: Publish to NPM
        if: steps.detect-new-version.outputs.previous-version != steps.detect-new-version.outputs.current-version
        run: |
          echo "Applying patch..."
          patch -p1 < submodules.patch

          echo "Installing npm and pnpm..."
          npm install -g npm@latest pnpm@12.15.0

          echo "Installing dependencies..."
          pnpm install --frozen-lockfile

          echo "Building..."
          pnpm run build

          echo "Packing..."
          cd packages/jspdf-fontkit
          pnpm pack --out package.tgz

          # npm (not pnpm) publishes: trusted publishing needs npm >= 11.5.1.
          # Provenance is generated automatically.
          echo "Publishing..."
          npm publish package.tgz --access public
